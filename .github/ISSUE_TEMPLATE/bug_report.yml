name: Bug report
description: Report a reproducible problem without uploading private footage or credentials.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not attach private media, credentials, tokens, or personal paths. Use a minimal synthetic reproduction when possible."
  - type: input
    id: command
    attributes:
      label: Command or workflow stage
      placeholder: prepare, frames, classify, compile, preview, approve, render, or qa
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized error output
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows version, Python version, CPU/GPU if relevant
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
